# ---------------------------------------------------------------------------
# Harmonised portfolio taxonomy for Tunisian cabinets, 1956-present.
#
# WHY THIS EXISTS
# Tunisian ministries are renamed, merged and split constantly. Raw titles in
# the sources include, for the same underlying policy domain:
#   "Secrétaire d'État à l'Intérieur", "Ministre de l'Intérieur",
#   "Ministre de l'Intérieur et du Développement local",
#   "وزير الداخلية"
# Analysing raw title strings would fragment one portfolio into a dozen
# categories and make any time-series or network comparison meaningless.
#
# `canonical` is the stable analytic category. `aliases` are case-insensitive,
# accent-insensitive regular expressions matched against the normalised raw
# title (see govtn.normalize.normalize_title). Matching is ORDERED: the first
# canonical block whose pattern matches wins, so more specific portfolios are
# declared before more general ones. This ordering is load-bearing - e.g.
# `higher_education` must precede `education`, and `foreign_affairs` must
# precede `affairs`-style catch-alls.
#
# Portfolios also carry:
#   power_rank   - coarse ordering used in elite-politics work. `sovereign`
#                  covers the classic ministères de souveraineté (interior,
#                  foreign affairs, justice, defence, finance); `economic`,
#                  `social`, `service` follow.
#   created      - first appearance, where the domain did not exist in 1956
#                  (useful for right-censoring portfolio-level time series).
# ---------------------------------------------------------------------------

ranks:
  # Cabinet rank, extracted separately from the policy domain. Ranks matter:
  # a secretary of state for finance is not the finance minister.
  - canonical: head_of_government
    level: 0
    aliases:
      - "^(premier ministre|chef du gouvernement|president du conseil)"
      - "^(prime minister|head of government)"
      - "رئيس (الحكومة|الوزراء)"
  - canonical: deputy_head_of_government
    level: 1
    aliases:
      - "vice[- ]?president du gouvernement"
      - "(premier |)ministre adjoint aupres du (premier ministre|chef du gouvernement)"
      - "deputy prime minister"
  - canonical: minister_of_state
    level: 2
    aliases:
      - "^ministre d'?etat"
      - "^minister of state"
      - "وزير دولة"
  - canonical: delegate_minister
    level: 4
    aliases:
      - "ministre delegue"
      - "minister delegate"
      - "وزير منتدب"
  - canonical: secretary_of_state
    level: 5
    aliases:
      - "secretaire d'?etat"
      - "secretary of state"
      - "كاتب دولة"
  - canonical: minister
    level: 3
    aliases:
      - "^ministre\\b"
      - "^minister\\b"
      - "^وزير"
  - canonical: state_secretary_general
    level: 6
    aliases:
      - "secretaire general du gouvernement"
      - "secretary general of the government"
      - "الامين العام للحكومة"

portfolios:

  - canonical: head_of_government
    label_en: "Head of government"
    label_fr: "Chef du gouvernement"
    power_rank: sovereign
    aliases:
      - "^(premier ministre|chef du gouvernement)$"
      - "^prime minister$"

  - canonical: interior
    label_en: "Interior"
    label_fr: "Intérieur"
    power_rank: sovereign
