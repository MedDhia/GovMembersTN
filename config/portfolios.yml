      - "interieur"
      - "\\binterior\\b"
      - "الداخلية"

  - canonical: foreign_affairs
    label_en: "Foreign affairs"
    label_fr: "Affaires étrangères"
    power_rank: sovereign
    aliases:
      - "affaires etrangeres"
      - "foreign affairs"
      - "الشؤون الخارجية"
      - "الخارجية"

  - canonical: justice
    label_en: "Justice"
    label_fr: "Justice"
