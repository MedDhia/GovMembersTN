  - id: TN-10
    head: "Mohamed Ghannouchi"
    head_role: prime_minister
    start: "1999-11-17"
    end: "2011-02-27"
    era: ben_ali
    spans_regime_change: true
    note: >-
      Longest-serving Prime Minister. Remained in office across the 14 January
      2011 rupture, forming two short-lived post-revolution governments
      (17 and 27 January 2011) before resigning on 27 February 2011. The
      `spans_regime_change` flag matters for era coding: appointments under this
      spell must be split at 2011-01-14 when era is assigned.
    wikipedia_fr: "Gouvernement Mohamed Ghannouchi"
    resolve_subcabinets: true
    confidence: high

