# ---------------------------------------------------------------------------
# Tunisian government spells, 1956-present.
#
# This file is the hand-curated SPINE of the dataset. It is deliberately
# conservative: it records the sequence of *government spells* (one per head of
# government) rather than every numbered cabinet and reshuffle. The individual
# numbered cabinets (e.g. "Gouvernement Ghannouchi I" vs "II") and their full
# ministerial rosters are resolved at harvest time from Wikipedia and Wikidata,
# because reshuffle numbering is a source-specific editorial convention and
# should not be frozen into a config file.
#
# Every record carries a `confidence` field:
#   high   - start/end dates cross-checked against multiple sources
#   medium - the spell is certain, exact boundary dates need source confirmation
#
# `wikipedia_fr` is a SEED article title. The harvester follows the navigation
# template `Modèle:Palette Gouvernements de la Tunisie` to enumerate the
# complete set of cabinet articles; the seeds here are a fallback and a check.
# ---------------------------------------------------------------------------

meta:
  country: Tunisia
  country_qid: Q948
  coverage_start: "1956-03-20"   # independence
  index_template_fr: "Modèle:Palette Gouvernements de la Tunisie"
  index_category_fr: "Catégorie:Gouvernement de la Tunisie"
  list_article_fr: "Liste des chefs du gouvernement tunisien"
  list_article_en: "List of prime ministers of Tunisia"

# Regime eras. Used as a categorical covariate for individual-level analysis
# and as a natural blocking variable for network comparisons.
eras:
  - id: protectorate_end
    label: "End of the protectorate"
    start: "1954-08-07"
    end: "1956-04-15"
  - id: monarchy
    label: "Kingdom of Tunisia (independent monarchy)"
    start: "1956-03-20"
    end: "1957-07-25"
  - id: bourguiba
    label: "Bourguiba republic"
    start: "1957-07-25"
    end: "1987-11-07"
  - id: ben_ali
    label: "Ben Ali republic"
    start: "1987-11-07"
    end: "2011-01-14"
  - id: transition
    label: "Post-revolution transition"
    start: "2011-01-14"
    end: "2014-12-31"
  - id: second_republic
    label: "Second Republic (2014 constitution)"
    start: "2014-12-31"
    end: "2021-07-25"
  - id: saied_exception
    label: "Post-25 July 2021 presidential rule / 2022 constitution"
    start: "2021-07-25"
    end: null

# Heads of state, for merging onto appointments as a contextual covariate.
heads_of_state:
  - name: "Lamine Bey"
    title: "Bey of Tunis"
    start: "1943-05-15"
    end: "1957-07-25"
  - name: "Habib Bourguiba"
    title: "President of the Republic"
    start: "1957-07-25"
    end: "1987-11-07"
  - name: "Zine El Abidine Ben Ali"
    title: "President of the Republic"
    start: "1987-11-07"
    end: "2011-01-14"
  - name: "Fouad Mebazaa"
    title: "Interim President"
    start: "2011-01-15"
    end: "2011-12-13"
    interim: true
  - name: "Moncef Marzouki"
    title: "President of the Republic"
    start: "2011-12-13"
    end: "2014-12-31"
  - name: "Béji Caïd Essebsi"
    title: "President of the Republic"
    start: "2014-12-31"
    end: "2019-07-25"
  - name: "Mohamed Ennaceur"
    title: "Interim President"
    start: "2019-07-25"
    end: "2019-10-23"
    interim: true
  - name: "Kaïs Saïed"
    title: "President of the Republic"
    start: "2019-10-23"
    end: null

# ---------------------------------------------------------------------------
# Government spells
# ---------------------------------------------------------------------------
# head_role:
#   prime_minister        - a distinct PM heads the government
#   head_of_government    - post-2014 title "chef du gouvernement"
#   president_as_head     - 1957-1969, Bourguiba headed the government himself
#                           and ministers held the rank of secretary of state
# ---------------------------------------------------------------------------
spells:

  - id: TN-00
    head: "Tahar Ben Ammar"
    head_role: prime_minister
    start: "1954-08-07"
    end: "1956-04-11"
    era: protectorate_end
    pre_independence: true
    note: >-
      Negotiated and signed the independence protocol of 20 March 1956, and
      continued as first head of government of the independent Kingdom from
      20 March until the handover to Bourguiba on 11 April 1956. Included for
      continuity with the protectorate elite; flagged `pre_independence` so it
      can be excluded from the post-independence analysis frame.
    wikipedia_fr: "Gouvernement Tahar Ben Ammar"
    confidence: medium

  - id: TN-01
    head: "Habib Bourguiba"
    head_role: prime_minister
    start: "1956-04-15"
    end: "1957-07-25"
    era: monarchy
    first_post_independence: true
    note: >-
      First government of independent Tunisia, formed under the monarchy of
      Lamine Bey. Ends with the proclamation of the Republic on 25 July 1957.
      SOURCES DIFFER ON THE START DATE: Bourguiba was appointed Prime Minister
      by the Bey on 11 April 1956, but the government's composition was
      announced on 15 April. The later date is used because the unit of this
      table is the GOVERNMENT, not the person's appointment; the four-day gap
      after TN-00 is the real interregnum, not a data error.
    wikipedia_fr: "Gouvernement Bourguiba I"
    confidence: high

  - id: TN-02
    head: "Habib Bourguiba"
    head_role: president_as_head
    start: "1957-07-29"
    end: "1969-11-07"
    era: bourguiba
    note: >-
      Between the proclamation of the Republic and the appointment of a Prime
      Minister in November 1969, Bourguiba was simultaneously head of state and
      head of government; cabinet members held the rank of secretary of state
      ("secrétaire d'État"). Sources differ on how many numbered governments to
      distinguish in this period (at minimum a new composition was formed after
      Bourguiba's election as president on 8 November 1959). The harvester
      resolves the numbered cabinets and their reshuffles from Wikipedia rather
      than freezing one convention here.
    wikipedia_fr: "Gouvernement Habib Bourguiba"
    resolve_subcabinets: true
    confidence: medium

  - id: TN-03
    head: "Bahi Ladgham"
    head_role: prime_minister
    start: "1969-11-07"
    end: "1970-11-02"
    era: bourguiba
    wikipedia_fr: "Gouvernement Ladgham"
    confidence: high

  - id: TN-04
    head: "Hédi Nouira"
    head_role: prime_minister
    start: "1970-11-02"
    end: "1980-04-23"
    era: bourguiba
    note: >-
      Appointed interim Prime Minister on 9 October 1970 while Ladgham was in
      Cairo; initial composition announced 6 November 1970.
    wikipedia_fr: "Gouvernement Hédi Nouira"
    resolve_subcabinets: true
    confidence: high

  - id: TN-05
    head: "Mohamed Mzali"
    head_role: prime_minister
    start: "1980-04-23"
    end: "1986-07-08"
    era: bourguiba
    note: >-
      Named coordinator of government action on 1 March 1980 before his formal
      appointment as Prime Minister on 23 April.
    wikipedia_fr: "Gouvernement Mohamed Mzali"
    resolve_subcabinets: true
    confidence: high

  - id: TN-06
    head: "Rachid Sfar"
    head_role: prime_minister
    start: "1986-07-08"
    end: "1987-10-02"
