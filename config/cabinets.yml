# Designated but never invested - these people never took office and must not
# appear in the appointments table. Kept here so the harvester can exclude them
# explicitly rather than silently.
designated_never_invested:
  - name: "Habib Jemli"
    designated: "2019-11-15"
    failed_confidence_vote: "2020-01-10"
    note: "Designated by Saïed on Ennahda's nomination; cabinet rejected by parliament."
