# ---------------------------------------------------------------------------
# Verified biographical seed for the heads of government.
#
# WHY THIS EXISTS
# The person-level columns (birth, birthplace, profession, QID) are normally
# filled by the Wikidata and Leaders harvests. This file seeds them for the
# 23 heads of government so that the dataset ships with a populated,
# demonstrable person frame even before a harvest has run, and so that the
# best-attested series in the dataset does not depend on the network.
#
# PROVENANCE AND PRECEDENCE
# Every value here was checked against at least one source (English/French
# Wikipedia, Wikidata item pages, or Tunisian press) at the date recorded in
# `verified`. Where a check did not produce a value, the field is OMITTED
# rather than guessed - an absent field is honest, an invented one is not.
#
# The harvest OVERRIDES this file: in `govtn.build.build_persons` the
# precedence is Wikidata > this seed > Leaders. The seed exists to fill gaps
# and to anchor QIDs, not to compete with structured data.
#
# `profession` uses the same controlled vocabulary as
# `persons.profession_domains` (see docs/CODEBOOK.md).
# ---------------------------------------------------------------------------

meta:
  verified: "2026-08-26"
  method: >-
    Each record cross-checked against Wikipedia/Wikidata and, for the
    post-2011 figures, Tunisian press reporting of the appointment. Fields
    that could not be confirmed were left out.
  precedence: "wikidata > seed > leaders"

