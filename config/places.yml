# Country or polity of birth for ministers born outside Tunisia.
#
# WHY THIS EXISTS
# Foreign birth is a finding, not missing data. Two distinct groups appear:
# the Circassian, Georgian and Caucasian origins of the Husainid-era mamluk
# administrators, and the French, Italian and Levantine births of the late
# protectorate and early independence elite. Left uncoded, both fall out of
# regional analysis while still counting in the denominator, which understates
# how much of the beylical state was staffed from outside the country.
#
# Values are the polity the source names, not a modern successor state:
# "Circassia" and "Caucasus" are regions, and "Russian Empire" is the state
# that existed at the time of birth. Do not treat these as ISO countries.
foreign_origins:
  Circassie: Circassia
  Caucase: Caucasus
  "Empire russe": Russian Empire
  Géorgie: Georgia
  Moldavie: Moldova
  Oran: Algeria
  Paris: France
  "6e arrondissement de Paris": France
  Marseille: France
  Maubeuge: France
  "Vernoil-le-Fourrier": France
  Kos: Greece
  Kardamila: Greece
  Guwahati: India
  Favignana: Italy
  Homs: Syria
  Douma: Syria

# ---------------------------------------------------------------------------
# Arabic-script settlement names.
#
# WHY THESE ARE HERE
# Arabic Wikipedia is the only source that covers recent cabinets in any
# depth, and it writes birthplaces in Arabic. With a Latin-only map those
# ministers were coded as having an unmapped birthplace - not missing from
# the sources, just unreadable to the pipeline.
#
# Every entry was taken from the Wikidata item for the settlement already in
# the map above, constrained to Tunisia and required to sit in the
# governorate that map assigns. That is the same containment check that
# caught El Guettar and Ezzahra being matched to the wrong governorate by
# name, so these carry the same guarantee rather than being transliterated by
# hand. Governorate names appear in both bare and "ولاية X" forms because
# sources use both.
# ---------------------------------------------------------------------------
