# Tool configuration only.
#
# There is deliberately no [project] table and no build backend. `src/govtn/`
# is the pipeline that produced `data/processed/` - provenance, not a
# prerequisite, as the README puts it - and nobody needs to install it to use
# the dataset. Declaring it a distributable package would advertise the
# opposite. This file exists so that the test suite runs the way a contributor
# expects it to.
#
# Before it, `pytest` from a clean checkout failed with
# `ModuleNotFoundError: No module named 'govtn'`, because only the Makefile
# put `src` on the path (`export PYTHONPATH := src`). That made `make test`
# the single entry point and left a bare `pytest`, an IDE's test runner and a
# single-file `pytest tests/test_build.py` all broken.

[tool.pytest.ini_options]
# Needs pytest >= 7.0; requirements.txt pins >= 7.4.
pythonpath = ["src"]
testpaths = ["tests"]
